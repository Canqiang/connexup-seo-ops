name: Build SEO Ops image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
      - uses: docker/login-action@v3
        with:
          username: chancetop
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          IMAGE=chancetop/connexup-seo-ops
          docker build --platform linux/amd64 -t "$IMAGE:$VERSION" -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" 2>/dev/null || true)
          echo "SEO Ops image: $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${DIGEST:-available after registry readback}" >> "$GITHUB_STEP_SUMMARY"
