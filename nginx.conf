server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /seo-ops/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /seo-ops {
        return 308 /seo-ops/;
    }

    location /seo-ops/ {
        try_files $uri $uri/ /seo-ops/index.html;
    }
}
