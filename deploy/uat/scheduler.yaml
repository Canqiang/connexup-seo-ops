apiVersion: apps/v1
kind: Deployment
metadata:
  name: seo-ops-scheduler
  labels: &labels
    app.kubernetes.io/name: connexup-seo-ops
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scheduler
          image: ghcr.io/canqiang/connexup-seo-ops-server:uat
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: seo-ops-config }
          env:
            - { name: SEO_OPS_RUNTIME_ROLE, value: scheduler }
            - { name: SEO_OPS_GBP_EXECUTION_ENABLED, value: "false" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: seo-ops-uat-secrets, key: DATABASE_URL }
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: seo-ops-uat-secrets, key: SESSION_SECRET }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
