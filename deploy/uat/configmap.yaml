apiVersion: v1
kind: ConfigMap
metadata:
  name: seo-ops-config
data:
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: "8787"
  SESSION_COOKIE_SECURE: "true"
  CORE_AI_BASE_URL: https://core-ai-server.connexup-uat.net
  SEO_OPS_SINGLE_USER: "false"
  SEO_OPS_MOCK_EXECUTION: "false"
  SEO_OPS_SCHEDULER_INTERVAL_MS: "60000"
  SEO_OPS_EXECUTION_POLL_INTERVAL_MS: "10000"
  SEO_OPS_GBP_EXECUTION_POLL_INTERVAL_MS: "10000"
  SEO_OPS_GBP_CORE_POLL_INTERVAL_MS: "3000"
  SEO_OPS_GBP_CORE_MAX_POLLS: "120"
  SEO_OPS_GBP_CORE_HTTP_TIMEOUT_MS: "15000"
  SEO_OPS_GBP_LEASE_MS: "600000"
