apiVersion: apps/v1
kind: Deployment
metadata:
  name: seo-ops-worker
  labels: &labels
    app.kubernetes.io/name: connexup-seo-ops
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/canqiang/connexup-seo-ops-server:uat
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: seo-ops-config }
          env:
            - { name: SEO_OPS_RUNTIME_ROLE, value: worker }
            - { name: SEO_OPS_GBP_EXECUTION_ENABLED, value: "true" }
            - { name: SEO_OPS_GBP_SECRET_DIR, value: /var/run/secrets/seo-ops/gbp }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: seo-ops-uat-secrets, key: DATABASE_URL }
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: seo-ops-uat-secrets, key: SESSION_SECRET }
            - name: CORE_AI_TOKEN
              valueFrom:
                secretKeyRef: { name: seo-ops-uat-secrets, key: CORE_AI_TOKEN }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: artifacts, mountPath: /app/server/data/artifacts }
            - { name: gbp-credentials, mountPath: /var/run/secrets/seo-ops/gbp, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: artifacts
          persistentVolumeClaim: { claimName: seo-ops-artifacts }
        - name: gbp-credentials
          secret: { secretName: seo-ops-gbp-credentials }
        - name: tmp
          emptyDir: {}
